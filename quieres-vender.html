  <meta name="description" content="Envía la información de tu propiedad a Diamantes Realty Group o contacta directamente a uno de nuestros asesores." />

  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="shortcut icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <meta name="theme-color" content="#071a33" />
  <meta property="og:site_name" content="Diamantes Realty Group" />
  <meta property="og:title" content="Vende tu propiedad | Diamantes Realty Group" />
  <meta property="og:image" content="https://www.diamantesrealtygroup.com/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link rel="stylesheet" href="css/public-navbar-transparent.css?v=20260904-01" />
</head>
<body class="seller-form-page">
  <header class="site-header">
    <div class="container nav-wrapper">
      <a class="brand" href="index.html" aria-label="Diamantes Realty Group - Inicio">
        <img src="assets/logo.png" alt="Logo Diamantes Realty Group" class="brand-logo" />
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
      <nav id="mainNav" class="site-nav">
        <a href="index.html">Inicio</a>
        <a href="propiedades.html">Propiedades</a>
        <a href="mapa.html">Mapa</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="agentes.html">Agentes</a>
        <a href="educacion.html">Educación</a>
        <a href="quieres-vender.html" class="active">¿Quieres vender?</a>
        <a href="contacto.html">Contacto</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Activar modo oscuro" type="button">🌙</button>
    </div>
  </header>

  <main class="seller-forms-main">
    <div class="seller-forms-shell">
      <div class="seller-forms-grid">
        <form class="seller-form" id="sellerForm" data-public-form="quiero-vender" novalidate>
          <div class="form-honeypot" aria-hidden="true"><label>Sitio web<input type="text" name="website" tabindex="-1" autocomplete="off" /></label></div>
          <h1>Vende tu propiedad</h1>

          <div class="form-row">
            <label>Nombre
              <input type="text" name="name" autocomplete="name" maxlength="100" required />
            </label>
            <label>Teléfono
              <input type="tel" name="phone" autocomplete="tel" maxlength="30" required />
            </label>
          </div>

          <div class="form-row">
            <label>Email
              <input type="email" name="email" autocomplete="email" maxlength="160" required />
            </label>
            <label>Tipo de publicación
              <select name="listing-type" required>
                <option value="">Selecciona</option>
                <option value="Venta">Venta</option>
                <option value="Alquiler">Alquiler</option>
              </select>
            </label>
          </div>

          <div class="form-row">
            <label>Tipo de propiedad
              <select name="property-type" required>
                <option value="">Selecciona</option>
                <option>Casa</option>
                <option>Apartamento</option>
                <option>Terreno</option>
                <option>Finca</option>
                <option>Local comercial</option>
              </select>
            </label>
            <label>Ciudad
              <input type="text" name="city" maxlength="120" required />
            </label>
          </div>

          <label>Información de la propiedad
            <textarea name="message" rows="4" maxlength="3000" placeholder="Ubicación, estado, precio estimado y cualquier información importante." required></textarea>
          </label>

          <p class="seller-auth-message" id="sellerAuthMessage" aria-live="polite"></p>
          <button type="submit">Enviar información</button>
        </form>

        <section class="seller-contact-card" aria-labelledby="sellerContactTitle">
          <h2 id="sellerContactTitle">Contacta un asesor</h2>
          <label class="seller-agent-label" for="sellerAgentSelect">Asesor
            <select id="sellerAgentSelect" class="seller-agent-select" aria-label="Selecciona un asesor para contactar por WhatsApp">
              <option value="">Cargando asesores...</option>
            </select>
          </label>
          <p class="seller-agent-message" id="sellerAgentMessage" aria-live="polite"></p>
          <a class="seller-whatsapp-btn" id="sellerWhatsappBtn" href="#" aria-disabled="true" target="_blank" rel="noopener noreferrer" aria-label="Contactar por WhatsApp">
            Contactar por WhatsApp
          </a>
        </section>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/firebase-client.js?v=20260613-01"></script>
  <script src="js/main.js?v=20260807-navbar-more"></script>
  <script src="js/public-forms.js?v=20260731"></script>
  <script src="js/quieres-vender.js?v=20260613-public-fix"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="title" content="Diamantes Realty Group" />
  <meta name="description" content="Plataforma inmobiliaria profesional en Nicaragua" />
  <title>Diamantes Realty Group</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
  <link rel="shortcut icon" type="image/png" href="assets/logo.png" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <meta name="theme-color" content="#B00008" />
  <meta property="og:site_name" content="Diamantes Realty Group" />
  <meta property="og:title" content="Diamantes Realty Group" />
  <meta property="og:image" content="https://www.diamantesrealtygroup.com/assets/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=20260806-typography-fix" />
  <link rel="stylesheet" href="css/premium-theme.css?v=20260807-navbar-more" />
  <link rel="stylesheet" href="css/footer.css?v=20260806-typography-fix" />
</head>
<body class="navbar-over-hero">
  <header class="site-header">
    <div class="container nav-wrapper">
      <a class="brand" href="index.html" aria-label="Diamantes Realty Group - Inicio">
        <img src="assets/logo.png" alt="Logo Diamantes Realty Group" class="brand-logo" />
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
      <nav id="mainNav" class="site-nav">
        <a href="index.html">Inicio</a>
        <a href="propiedades.html">Propiedades</a>
        <a href="mapa.html">Mapa</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="agentes.html">Agentes</a>
        <a href="educacion.html">Educación</a>
        <a href="quieres-vender.html">¿Quieres vender?</a>
        <a href="contacto.html" class="active">Contacto</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Activar modo oscuro" type="button">🌙</button>
    </div>
  </header>

  <main>
    <section class="page-banner">
      <div class="container">
        <h1>Hablemos de tu próxima propiedad</h1>
        <p>Recibe asesoría personalizada de nuestro equipo experto.</p>
      </div>
    </section>

    <section class="section container">
      <form class="contact-form" id="contactForm" data-public-form="contacto" novalidate>
        <div class="form-honeypot" aria-hidden="true"><label for="contactWebsite">Sitio web</label><input id="contactWebsite" name="website" type="text" tabindex="-1" autocomplete="off" /></div>
        <div class="form-row">
          <label for="nombre">Nombre</label>
          <input id="nombre" name="nombre" type="text" maxlength="100" required />
        </div>
        <div class="form-row">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" maxlength="160" required />
        </div>
        <div class="form-row">
          <label for="telefono">Teléfono</label>
          <input id="telefono" name="telefono" type="tel" maxlength="30" required />
        </div>
        <div class="form-row">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="6" maxlength="3000" required></textarea>
        </div>
        <button type="submit">Enviar consulta</button>
        <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-client.js"></script>
  <script src="js/public-forms.js"></script>
  <script src="js/main.js?v=20260807-navbar-more"></script>
</body>
</html>

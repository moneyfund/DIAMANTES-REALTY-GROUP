<body class="properties-page">
  <header class="site-header">
    <div class="container nav-wrapper">
      <a class="brand" href="index.html" aria-label="Diamantes Realty Group - Inicio">
        <img src="assets/logo.png" alt="Logo Diamantes Realty Group" class="brand-logo" />
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
      <nav id="mainNav" class="site-nav">
        <a href="index.html">Inicio</a>
        <a href="propiedades.html" class="active">Propiedades</a>
        <a href="mapa.html">Mapa</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="agentes.html">Agentes</a>
        <a href="educacion.html">Educación</a>
        <a href="quieres-vender.html">¿Quieres vender?</a>
        <a href="contacto.html">Contacto</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Activar modo oscuro" type="button">🌙</button>
    </div>
  </header>

  <main>
    <section class="section section-properties container">
      <header class="properties-compact-header">
        <h1>Encuentra tu propiedad ideal</h1>
      </header>
      <p id="agentFilterBanner" class="agent-filter-banner hidden"></p>

      <form id="filterForm" class="properties-unified-form" autocomplete="off">
        <div class="map-unified-searchbar properties-searchbar">
          <div class="map-search-control public-map-search-control properties-search-control">
            <label class="sr-only" for="filterLocation">Buscar ciudad, barrio, zona o dirección</label>
            <div class="map-search-input-row">
              <span class="map-search-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><path d="M10.5 4a6.5 6.5 0 0 1 5.18 10.43l4.45 4.44-1.42 1.42-4.44-4.45A6.5 6.5 0 1 1 10.5 4Zm0 2a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"></path></svg></span>
              <input id="filterLocation" type="search" autocomplete="off" placeholder="Busca ciudad, barrio, zona o dirección" aria-label="Buscar ciudad, barrio, zona o dirección" />
              <button type="button" id="propertiesSearchClear" class="map-search-clear hidden" aria-label="Limpiar búsqueda">×</button>
            </div>
          </div>

          <details class="map-unified-filter-popover properties-filter-popover" id="propertiesFilterPopover">
            <summary aria-label="Abrir filtros avanzados">
              <span class="map-filter-summary-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 7h10m4 0h2M4 17h2m4 0h10M14 4v6M6 14v6"/></svg>
              </span>
              <strong>Filtros</strong>
              <small>Ajustar búsqueda</small>
              <span class="map-filter-chevron" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg></span>
            </summary>
            <div class="map-filter-panel properties-filter-panel">
              <header class="map-filter-panel-header">
                <div>
                  <p>Búsqueda avanzada</p>
                  <h2>Afina tus resultados</h2>
                </div>
              </header>
              <div class="map-filter-strip properties-filter-strip">
                <label>
                  <span>Tipo de propiedad</span>
                  <select id="filterType">
                    <option value="">Todos los tipos</option>
                    <option value="house">Casas</option>
                    <option value="apartment">Apartamentos</option>
                    <option value="land">Terrenos</option>
                    <option value="warehouse">Bodegas</option>
                    <option value="farm">Fincas</option>
                    <option value="quinta">Quintas</option>
                    <option value="beach_house">Casas cerca del mar</option>
                  </select>
                </label>
                <label>
                  <span>Operación</span>
                  <select id="filterOperation">
                    <option value="">Venta o alquiler</option>
                    <option value="venta">Venta</option>
                    <option value="alquiler">Alquiler</option>
                  </select>
                </label>
                <label>
                  <span>Presupuesto máximo</span>
                  <select id="filterBudget">
                    <option value="">Sin límite</option>
                    <option value="150000">Hasta $150,000</option>
                    <option value="300000">Hasta $300,000</option>
                    <option value="500000">Hasta $500,000</option>
                    <option value="1000000">Hasta $1,000,000</option>
                  </select>
                </label>
                <button class="properties-filter-apply" type="submit">Aplicar filtros</button>
              </div>
            </div>
          </details>
        </div>
      </form>

      <div id="propertiesGrid" class="properties-grid"></div>
      <p id="emptyState" class="empty-state hidden">No se encontraron propiedades con esos criterios.</p>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<body>
  <header class="site-header">
    <div class="container nav-wrapper">
      <a class="brand" href="index.html" aria-label="Diamantes Realty Group - Inicio">
        <img src="assets/logo.png" alt="Logo Diamantes Realty Group" class="brand-logo" />
      </a>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">☰</button>
      <nav id="mainNav" class="site-nav">
        <a href="index.html">Inicio</a>
        <a href="propiedades.html" class="active">Propiedades</a>
        <a href="mapa.html">Mapa</a>

        <a href="contacto.html">Contacto</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" aria-label="Activar modo oscuro" type="button">🌙</button>
    </div>
  </header>

  <main>
    <section class="section section-properties container">
      <header class="properties-compact-header">
        <h1>Propiedades disponibles</h1>
      </header>
      <p id="agentFilterBanner" class="agent-filter-banner hidden"></p>

      <form id="filterForm" class="filter-grid">
        <select id="filterLocation" aria-label="Ubicación">
          <option value="">Todos los departamentos</option>
          <option value="Boaco">Boaco</option>
          <option value="Carazo">Carazo</option>
          <option value="Chinandega">Chinandega</option>
          <option value="Chontales">Chontales</option>
          <option value="Estelí">Estelí</option>
          <option value="Granada">Granada</option>
          <option value="Jinotega">Jinotega</option>
          <option value="León">León</option>
          <option value="Madriz">Madriz</option>
          <option value="Managua">Managua</option>
          <option value="Masaya">Masaya</option>
          <option value="Matagalpa">Matagalpa</option>
          <option value="Nueva Segovia">Nueva Segovia</option>
          <option value="Rivas">Rivas</option>
          <option value="Río San Juan">Río San Juan</option>
        </select>
        <select id="filterType">
          <option value="">Tipo de propiedad</option>
          <option value="house">Casas</option>
          <option value="apartment">Apartamentos</option>
          <option value="land">Terrenos</option>
          <option value="warehouse">Bodegas</option>
          <option value="farm">Fincas</option>
          <option value="quinta">Quintas</option>
          <option value="beach_house">Casas cerca del mar</option>
        </select>
        <select id="filterOperation">
          <option value="">Tipo de operación</option>
          <option value="venta">Venta</option>
          <option value="alquiler">Alquiler</option>
        </select>
        <select id="filterBudget">
          <option value="">Presupuesto máximo</option>
          <option value="150000">Hasta $150,000</option>
          <option value="300000">Hasta $300,000</option>
          <option value="500000">Hasta $500,000</option>
          <option value="1000000">Hasta $1,000,000</option>
        </select>
        <button type="submit">Aplicar filtros</button>
      </form>

      <div id="propertiesGrid" class="properties-grid"></div>
      <p id="emptyState" class="empty-state hidden">No se encontraron propiedades con esos criterios.</p>
    </section>
  </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="js/properties.js?v=20260613-01"></script>
</body>
</html>
